[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ecology"
version = "0.1.0"
description = "Sparse recurrent computational ecology model for Agent v0"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4,<3",
  "numpy>=1.26,<3"
]

[project.optional-dependencies]
export = [
  "onnx>=1.16",
  "onnxruntime>=1.18"
]
test = [
  "pytest>=8"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_ecology*", "agent_runtime*", "agent_language*", "agent_cognition*", "delta_hybrid*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

