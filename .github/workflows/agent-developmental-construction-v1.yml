name: Agent Developmental Construction Gate v1
on:
  push:
    branches:
      - experiment/agent-v1-developmental-ecology
    paths:
      - 'agent-model/agent_language/developmental_construction_gate_v1.py'
      - '.github/workflows/agent-developmental-construction-v1.yml'
  workflow_dispatch:

jobs:
  developmental-construction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/agent-v1-developmental-ecology
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run three-seed developmental construction gate
        run: |
          python agent-model/agent_language/developmental_construction_gate_v1.py \
            --seeds 0,1,2 \
            --out developmental_construction_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: Agent-Developmental-Construction-V1
          path: developmental_construction_v1.json
