name: SemVM Structured Compiler

on:
  workflow_dispatch:
  push:
    branches: [semzip-vm]
    paths:
      - ".github/workflows/semzip-vm-structured-compiler.yml"
      - "semzip/benchmarks/compiler_structured_corpus.py"
      - "semzip/benchmarks/train_structured_compiler.py"
      - "semzip/benchmarks/compiler_corpus.py"
      - "semzip/benchmarks/compiler_slot_corpus.py"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: semvm-smollm2-135m-v1

      - name: Install SemVM
        run: python -m pip install -e ./semzip

      - name: Install CPU training runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "transformers>=4.45,<5" safetensors "peft>=0.13,<1"

      - name: Smoke structured corpus
        run: |
          cd semzip
          python benchmarks/compiler_structured_corpus.py

      - name: Train structured compiler
        run: |
          cd semzip
          python benchmarks/train_structured_compiler.py --train-samples 256 --eval-samples 64 --epochs 6 --batch-size 8

      - name: Show result
        if: always()
        run: |
          if [ -f semzip/compiler-structured-results.json ]; then
            python -c "import json; p=json.load(open('semzip/compiler-structured-results.json')); print(json.dumps({k:p[k] for k in ('mode','train_samples','eval_samples','epochs','trainable_parameters','operation_accuracy','argument_accuracy','exact_structure','exact_structure_accuracy','family_exact','loss_history')}, indent=2))"
          fi

      - name: Upload adapter and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semvm-smollm2-135m-structured-compiler
          path: |
            semzip/compiler-structured-results.json
            semzip/semvm-structured-compiler-adapter
          if-no-files-found: warn
          retention-days: 14
