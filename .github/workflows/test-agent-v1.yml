name: Test Agent V1 Developmental Foundation

on:
  workflow_dispatch:
  push:
    branches:
      - "experiment/agent-v1-developmental-ecology"
    paths:
      - "agent-model/**"
      - "docs/AGENT_V1_A_SPEC.md"
      - "docs/AGENT_V1_A0_RESULT.md"
      - "docs/AGENT_V1_A1_SMOKE.md"
      - ".github/workflows/test-agent-v1.yml"

permissions:
  contents: read

concurrency:
  group: agent-v1-developmental-foundation
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU test stack
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4,<3"
          python -m pip install "numpy>=1.26,<3" "pytest>=8"
          python -m pip install -e agent-model --no-deps

      - name: Run Agent model tests
        run: |
          set -euo pipefail
          pytest agent-model/tests

      - name: Prove lifetime trace replay is deterministic
        working-directory: agent-model
        run: |
          set -euo pipefail
          python -m agent_ecology.v1a             --world-size 1000             --count 256             --seed 77             --output /tmp/v1a-first.jsonl
          python -m agent_ecology.v1a             --world-size 1000             --count 256             --seed 77             --output /tmp/v1a-second.jsonl
          cmp /tmp/v1a-first.jsonl /tmp/v1a-second.jsonl

      - name: Paired fixed-control pilot across all lifetime regimes
        working-directory: agent-model
        run: |
          set -euo pipefail
          COMMON="--world-size 500 --experiences 500 --sequence-length 4 --world-seed 91 --model-seed 17 --state-dim 24 --workspace-slots 3 --signature-dim 12 --message-dim 12 --thought-steps 2 --routing-noise-std 0.0 --log-every 50"
          python -m agent_ecology.v1_controls --control fixed16 $COMMON --output /tmp/v1a-fixed16.json
          python -m agent_ecology.v1_controls --control sparse64 $COMMON --output /tmp/v1a-sparse64.json
          python -m agent_ecology.v1_controls --control dense64 $COMMON --output /tmp/v1a-dense64.json

      - name: Upload V1 pilot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Agent-V1-A0-A1-Pilot
          path: |
            /tmp/v1a-first.jsonl
            /tmp/v1a-fixed16.json
            /tmp/v1a-sparse64.json
            /tmp/v1a-dense64.json
          retention-days: 30
