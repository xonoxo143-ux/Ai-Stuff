name: Agent Whole-Agent Chatbot v1
on:
  push:
    branches:
      - experiment/agent-v1-developmental-ecology
    paths:
      - 'agent-model/agent_runtime/whole_agent_chatbot_benchmark_v1.py'
      - '.github/workflows/agent-whole-agent-chatbot-v1.yml'
  workflow_dispatch:
jobs:
  chatbot-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/agent-v1-developmental-ecology
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch
        run: python -m pip install --upgrade pip && pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run expanded whole-agent benchmark
        working-directory: agent-model
        run: |
          python -m agent_runtime.whole_agent_chatbot_benchmark_v1 \
            --seeds 0,1,2 \
            --out ../whole_agent_chatbot_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: Agent-Whole-Agent-Chatbot-V1
          path: whole_agent_chatbot_v1.json
