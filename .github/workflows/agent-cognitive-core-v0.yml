name: Agent Cognitive Core V0

on:
  workflow_dispatch:
  push:
    branches:
      - "experiment/agent-v1-developmental-ecology"
    paths:
      - "agent-model/agent_cognition/**"
      - "agent-model/tests/test_agent_cognition_v0.py"
      - "docs/AGENT_COGNITIVE_CORE_V0.md"
      - ".github/workflows/agent-cognitive-core-v0.yml"

permissions:
  contents: read

concurrency:
  group: agent-cognitive-core-v0
  cancel-in-progress: true

jobs:
  cognition:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU training stack
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install             --index-url https://download.pytorch.org/whl/cpu             "torch>=2.4,<3"
          python -m pip install "numpy>=1.26,<3" "pytest>=8"
          python -m pip install -e agent-model --no-deps

      - name: Validate cognition package syntax
        run: |
          set -euo pipefail
          python -m compileall -q agent-model/agent_cognition

      - name: Validate benchmark and model contracts
        run: |
          set -euo pipefail
          pytest agent-model/tests/test_agent_cognition_v0.py

      - name: Compare shared cores across seeds
        working-directory: agent-model
        run: |
          set -euo pipefail
          mkdir -p /tmp/cognition-v0
          python -m agent_cognition.train             --models flat,factor_onepass,factor,factor_no_reinject             --seeds 11,22,33             --steps 400             --batch-size 32             --eval-per-family 200             --threads 4             --output /tmp/cognition-v0/shared.json

      - name: Measure specialist ceilings
        working-directory: agent-model
        run: |
          set -euo pipefail
          python -m agent_cognition.specialists             --seeds 11,22,33             --steps 250             --batch-size 32             --threads 4             --output /tmp/cognition-v0/specialists.json

      - name: Probe recurrent thought depth
        working-directory: agent-model
        run: |
          set -euo pipefail
          python -m agent_cognition.depth_probe             --seeds 11,22,33             --train-steps 250             --batch-size 32             --depths 1,2,4,6,8             --eval-per-family 150             --threads 4             --output /tmp/cognition-v0/depth.json

      - uses: actions/upload-artifact@v4
        with:
          name: Agent-Cognitive-Core-V0
          path: /tmp/cognition-v0/
          retention-days: 30
