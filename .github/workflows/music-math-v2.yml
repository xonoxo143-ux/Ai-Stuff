name: Alien Math Music Experiment V2

on:
  push:
    branches: [music-math-experiment]
    paths:
      - "music_math/manifest_v2.json"
      - "music_math/run_v2.py"
      - ".github/workflows/music-math-v2.yml"

permissions:
  contents: write

jobs:
  analyze-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: music-math-experiment
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scientific stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          pip install numpy scipy scikit-learn matplotlib ripser
      - name: Run 80-track nonlinear alien-math experiment
        run: python music_math/run_v2.py
      - name: Upload V2 result bundle
        uses: actions/upload-artifact@v4
        with:
          name: alien-math-music-results-v2
          path: music_math/results_v2/
      - name: Save V2 results to experiment branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music_math/results_v2/
          git diff --cached --quiet || git commit -m "Record alien-math v2 results [skip ci]"
          git push
