name: SemVM Compact Semantic Storage

on:
  workflow_dispatch:
  push:
    branches: [semzip-vm]
    paths:
      - ".github/workflows/semzip-vm-compact-storage.yml"
      - "semzip/benchmarks/compact_semantic_storage.py"
      - "semzip/src/semzip/vm_binary.py"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ./semzip
      - name: Encode 100k semantic patches
        run: |
          cd semzip
          python benchmarks/compact_semantic_storage.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semvm-compact-semantic-storage
          path: semzip/compact-semantic-storage.json
          if-no-files-found: warn
          retention-days: 14
