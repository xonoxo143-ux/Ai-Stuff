name: SemVM Relation Subset Compiler

on:
  workflow_dispatch:
  push:
    branches: [semzip-vm]
    paths:
      - ".github/workflows/semzip-vm-relation-subset.yml"
      - "semzip/benchmarks/train_relation_subset_compiler.py"
      - "semzip/benchmarks/compiler_delta_corpus.py"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache tiny encoder
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: semvm-google-bert-l2-h128-v1
      - name: Install SemVM
        run: python -m pip install -e ./semzip
      - name: Install CPU training runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "transformers>=4.45,<5" safetensors
      - name: Train relation-subset compiler
        run: |
          cd semzip
          python benchmarks/train_relation_subset_compiler.py \
            --model google/bert_uncased_L-2_H-128_A-2 \
            --train-samples 512 --eval-samples 96 --epochs 14 --batch-size 16 --semantic-dim 32
      - name: Show result
        if: always()
        run: |
          if [ -f semzip/compiler-relation-subset-results.json ]; then
            python -c "import json; p=json.load(open('semzip/compiler-relation-subset-results.json')); print(json.dumps({k:p[k] for k in ('model','mode','total_parameters','head_parameters','relation_subset_accuracy','active_pointer_accuracy','exact_frame','exact_frame_accuracy','family_exact','loss_history')}, indent=2))"
          fi
      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semvm-relation-subset-compiler
          path: semzip/compiler-relation-subset-results.json
          if-no-files-found: warn
          retention-days: 14
