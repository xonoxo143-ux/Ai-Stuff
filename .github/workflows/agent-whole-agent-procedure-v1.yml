name: Agent Whole-Agent Procedure Gate v1
on:
  push:
    branches:
      - experiment/agent-v1-developmental-ecology
    paths:
      - 'agent-model/agent_runtime/whole_agent_procedure_gate_v1.py'
      - '.github/workflows/agent-whole-agent-procedure-v1.yml'
  workflow_dispatch:

jobs:
  procedure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/agent-v1-developmental-ecology
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch
        run: python -m pip install --upgrade pip && pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run real chatbot repeated-procedure gate
        working-directory: agent-model
        run: |
          python -m agent_runtime.whole_agent_procedure_gate_v1 \
            --seeds 0,1,2 \
            --out ../whole_agent_procedure_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: Agent-Whole-Agent-Procedure-V1
          path: whole_agent_procedure_v1.json
