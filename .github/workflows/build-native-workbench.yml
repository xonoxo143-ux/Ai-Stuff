name: Build Native AI Workbench

on:
  workflow_dispatch:
  push:
    branches:
      - aistuff
    paths:
      - "android-shell/**"
      - ".github/workflows/build-native-workbench.yml"

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write

concurrency:
  group: aistuff-native-kernel
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ANDROID_NDK_VERSION: "28.1.13356709"
      ANDROID_CMAKE_VERSION: "3.22.1"
      BASE_MODEL_RUN_ID: "36106396883"

    steps:
      - uses: actions/checkout@v4

      - name: Download current Agent v0 model package
        uses: actions/download-artifact@v4
        with:
          name: Agent-v0-Phone-Package
          path: previous-agent
          github-token: ${{ github.token }}
          run-id: ${{ env.BASE_MODEL_RUN_ID }}

      - name: Bundle current Agent model
        run: |
          set -euo pipefail
          rm -rf android-shell/app/src/main/assets/agent-model
          mkdir -p android-shell/app/src/main/assets/agent-model
          cp previous-agent/agent-model/artifacts/agent-ecology-thought-step.onnx             android-shell/app/src/main/assets/agent-model/
          cp previous-agent/agent-model/artifacts/agent-ecology-thought-step.json             android-shell/app/src/main/assets/agent-model/

      - name: Bundle fallback workbench
        run: |
          set -euo pipefail
          rm -rf android-shell/app/src/main/assets/workbench
          mkdir -p android-shell/app/src/main/assets/workbench/benchmarks
          cp -a workbench-web/. android-shell/app/src/main/assets/workbench/
          cp workspace/benchmarks/chatbot-v0.json android-shell/app/src/main/assets/workbench/benchmarks/
          cp workspace/benchmarks/agent-ecology-v0.json android-shell/app/src/main/assets/workbench/benchmarks/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Use Android SDK
        run: |
          test -x "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android build components
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager             "platform-tools"             "platforms;android-35"             "build-tools;35.0.1"             "ndk;${ANDROID_NDK_VERSION}"             "cmake;${ANDROID_CMAKE_VERSION}"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Cache native build
        uses: actions/cache@v4
        with:
          path: android-shell/app/.cxx
          key: native-kernel-${{ runner.os }}-${{ hashFiles('android-shell/app/src/main/cpp/**', 'android-shell/app/build.gradle.kts') }}

      - name: Run Agent kernel unit tests
        run: |
          set -euo pipefail
          gradle -p android-shell --no-daemon --console=plain :app:testDebugUnitTest

      - name: Prepare stable Android signing
        env:
          AI_WORKBENCH_SIGNING_BUNDLE: ${{ secrets.AI_WORKBENCH_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          python3 scripts/prepare_android_signing.py
          echo "AI_WORKBENCH_VERSION_CODE=$(date +%s)" >> "$GITHUB_ENV"
          echo "AI_WORKBENCH_VERSION_NAME=0.4.${GITHUB_RUN_NUMBER}-stable" >> "$GITHUB_ENV"

      - name: Build native APK
        run: |
          set -euo pipefail
          gradle -p android-shell --no-daemon --console=plain :app:assembleDebug
          mkdir -p dist
          cp android-shell/app/build/outputs/apk/debug/app-debug.apk dist/AIWorkbench-kernel2-debug.apk
          sha256sum dist/AIWorkbench-kernel2-debug.apk | tee dist/AIWorkbench-kernel2-debug.apk.sha256

      - name: Verify APK
        run: |
          set -euo pipefail
          tools="${ANDROID_SDK_ROOT}/build-tools/35.0.1"
          "$tools/apksigner" verify --verbose dist/AIWorkbench-kernel2-debug.apk
          python3 scripts/verify_android_signing.py "$tools/apksigner" dist/AIWorkbench-kernel2-debug.apk
          "$tools/aapt" dump badging dist/AIWorkbench-kernel2-debug.apk | tee dist/apk-badging.txt
          grep -q "package: name='com.xonoxo.aiworkbench.k2'" dist/apk-badging.txt
          grep -q "launchable-activity:" dist/apk-badging.txt
          unzip -l dist/AIWorkbench-kernel2-debug.apk | tee dist/apk-contents.txt
          grep -q "lib/arm64-v8a/libai_workbench_native.so" dist/apk-contents.txt
          grep -q "assets/workbench/index.html" dist/apk-contents.txt
          grep -q "assets/agent-model/agent-ecology-thought-step.onnx" dist/apk-contents.txt
          grep -q "assets/agent-model/agent-ecology-thought-step.json" dist/apk-contents.txt

      - name: Attest APK with GitHub OIDC
        uses: actions/attest@v4
        with:
          subject-path: dist/AIWorkbench-kernel2-debug.apk

      - name: Publish verified native update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cp dist/AIWorkbench-kernel2-debug.apk dist/AIWorkbench.apk
          apk_sha="$(sha256sum dist/AIWorkbench.apk | awk '{print $1}')"
          tag="native-${AI_WORKBENCH_VERSION_CODE}"

          gh release create "$tag" dist/AIWorkbench.apk             --repo "${GITHUB_REPOSITORY}"             --target "${GITHUB_SHA}"             --title "AI Workbench ${AI_WORKBENCH_VERSION_NAME}"             --notes "Stable-signed native AI Workbench update."

          mkdir -p /tmp/native-release
          python3 - <<PY
          import json, os
          manifest = {
              "schema": 1,
              "package": "com.xonoxo.aiworkbench.k2",
              "version_code": int(os.environ["AI_WORKBENCH_VERSION_CODE"]),
              "version_name": os.environ["AI_WORKBENCH_VERSION_NAME"],
              "sha256": "$apk_sha",
              "signing_sha256": "E2:E3:D6:D0:FE:17:D9:7F:E7:68:55:F5:75:8D:92:3D:BA:2A:5F:7D:95:EA:59:DA:25:7B:38:B0:42:C9:07:EF",
              "apk_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/$tag/AIWorkbench.apk",
              "source_sha": os.environ["GITHUB_SHA"],
          }
          with open("/tmp/native-release/current.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin aistuff
          git checkout -B publish origin/aistuff
          mkdir -p workspace/releases/native
          cp /tmp/native-release/current.json workspace/releases/native/current.json
          git add workspace/releases/native/current.json
          git commit -m "Publish native update ${AI_WORKBENCH_VERSION_NAME}" || exit 0
          git push origin HEAD:aistuff


      - uses: actions/upload-artifact@v4
        with:
          name: AIWorkbench-Native-Kernel2
          path: dist/*
          retention-days: 30
