name: Agent Execution-Grounded Language v0
on:
  push:
    branches:
      - experiment/agent-v1-developmental-ecology
    paths:
      - 'agent-model/agent_language/execution_grounding_gate_v0.py'
      - '.github/workflows/agent-execution-grounding-v0.yml'
  workflow_dispatch:

jobs:
  execution-grounding:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/agent-v1-developmental-ecology
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run three-seed execution-grounding gate
        run: |
          python agent-model/agent_language/execution_grounding_gate_v0.py \
            --seeds 0,1,2 \
            --out execution_grounding_v0.json
      - uses: actions/upload-artifact@v4
        with:
          name: Agent-Execution-Grounding-V0
          path: execution_grounding_v0.json
