name: Stock Forecast Acquisition Relay

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Acquire and validate raw sources
        shell: bash
        run: |
          set -u
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, os, ssl
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlparse
          from urllib.request import Request, build_opener, HTTPRedirectHandler, HTTPSHandler

          ROOT = Path('stock_forecast_raw_bundle')
          RESP = ROOT / 'responses'
          RESP.mkdir(parents=True, exist_ok=True)
          SAFE_RESPONSE_HEADERS = {'content-type','content-length','last-modified','etag','date','cache-control'}
          RESEARCH_UA = 'blind-historical-stock-forecast/0.2 contact https://github.com/xonoxo143-ux/Ai-Stuff'
          BROWSER_UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/138.0.0.0 Safari/537.36'

          requests = [
            {
              'request_id':'iwb_holdings_json_2025-12-31','provider':'ishares_iwb_holdings',
              'url':'https://www.ishares.com/us/products/239707/ishares-russell-1000-etf/1467271812596.ajax?fileType=json&tab=all&asOfDate=20251231',
              'output':'iwb_holdings_2025-12-31.json','hosts':{'www.ishares.com'},
              'types':{'application/json','text/plain'},'max_bytes':25_000_000,
              'headers':{'User-Agent':BROWSER_UA,'Accept':'application/json,text/plain,*/*','Referer':'https://www.ishares.com/us/products/239707/ishares-russell-1000-etf'},
              'signature':'json_object'
            },
            {
              'request_id':'aapl_yahoo_prices_2026-02-10','provider':'yahoo_chart',
              'url':'https://query1.finance.yahoo.com/v8/finance/chart/AAPL?period1=1739250000&period2=1770786000&interval=1d&events=div%2Csplits&includeAdjustedClose=true',
              'output':'aapl_yahoo_prices_2026-02-10.json','hosts':{'query1.finance.yahoo.com'},
              'types':{'application/json','text/plain'},'max_bytes':10_000_000,
              'headers':{'User-Agent':RESEARCH_UA,'Accept':'application/json'},'signature':'json_object'
            },
            {
              'request_id':'aapl_nasdaq_prices_2026-02-10','provider':'nasdaq_historical',
              'url':'https://api.nasdaq.com/api/quote/AAPL/historical?assetclass=stocks&fromdate=2025-02-11&todate=2026-02-10&limit=5000',
              'output':'aapl_nasdaq_prices_2026-02-10.json','hosts':{'api.nasdaq.com'},
              'types':{'application/json','text/plain'},'max_bytes':10_000_000,
              'headers':{'User-Agent':BROWSER_UA,'Accept':'application/json, text/plain, */*','Origin':'https://www.nasdaq.com','Referer':'https://www.nasdaq.com/'},
              'signature':'json_object'
            },
            {
              'request_id':'aapl_sec_after_hours_header','provider':'sec_archive',
              'url':'https://www.sec.gov/Archives/edgar/data/320193/000032019326000011/0000320193-26-000011-index-headers.html',
              'output':'aapl_2026-04-30_after_hours_headers.html','hosts':{'www.sec.gov'},
              'types':{'text/html','text/plain'},'max_bytes':2_000_000,
              'headers':{'User-Agent':RESEARCH_UA,'Accept':'text/html'},'signature':'html'
            },
            {
              'request_id':'sec_company_tickers','provider':'sec_reference',
              'url':'https://www.sec.gov/files/company_tickers.json',
              'output':'sec_company_tickers.json','hosts':{'www.sec.gov'},
              'types':{'application/json','text/plain'},'max_bytes':20_000_000,
              'headers':{'User-Agent':RESEARCH_UA,'Accept':'application/json'},'signature':'json_object'
            },
            {
              'request_id':'unrate_alfred_graph_vintage_2026-02-10','provider':'alfred_graph_csv',
              'url':'https://alfred.stlouisfed.org/graph/alfredgraph.csv?id=UNRATE&vintage_date=2026-02-10&cosd=1900-01-01&coed=2026-02-10',
              'output':'unrate_alfred_2026-02-10.csv','hosts':{'alfred.stlouisfed.org'},
              'types':{'text/csv','application/csv','text/plain','application/octet-stream'},'max_bytes':20_000_000,
              'headers':{'User-Agent':RESEARCH_UA,'Accept':'text/csv,application/csv,text/plain'},'signature':'csv'
            },
          ]

          class RedirectRecorder(HTTPRedirectHandler):
            def __init__(self): super().__init__(); self.redirects=[]
            def redirect_request(self, req, fp, code, msg, headers, newurl):
              self.redirects.append({'status':code,'from':req.full_url,'to':newurl})
              return super().redirect_request(req,fp,code,msg,headers,newurl)

          def signature_ok(kind, body):
            sample=body[:4096].lstrip(b'\xef\xbb\xbf\x00\t\r\n ')
            lower=sample.lower()
            if kind=='json_object':
              if not sample.startswith(b'{'): return False, 'body is not a JSON object'
              try: json.loads(body.decode('utf-8-sig'))
              except Exception as exc: return False, f'invalid JSON: {exc}'
              return True, None
            if kind=='csv':
              if lower.startswith(b'<!doctype html') or lower.startswith(b'<html'): return False, 'HTML body disguised as CSV'
              if b',' not in sample.splitlines()[0]: return False, 'first line is not CSV-like'
              return True, None
            if kind=='html':
              if b'<html' not in lower and b'<!doctype html' not in lower: return False, 'body is not HTML'
              return True, None
            return False, f'unknown signature {kind}'

          manifest={'bundle_version':2,'purpose':'Disposable pre-cutoff acquisition rehearsal and source validation; not a final exam packet.',
                    'started_at_utc':datetime.now(timezone.utc).isoformat(),'git_sha':os.getenv('GITHUB_SHA'),'git_ref':os.getenv('GITHUB_REF'),
                    'artifacts':[],'rejections':[],'validations':[]}
          context=ssl.create_default_context()
          for spec in requests:
            print('ACQUIRE',spec['request_id'],flush=True); rr=RedirectRecorder()
            try:
              opener=build_opener(rr,HTTPSHandler(context=context))
              headers=dict(spec['headers']); headers['Accept-Encoding']='identity'
              req=Request(spec['url'],headers=headers,method='GET')
              with opener.open(req,timeout=60) as response:
                final_url=response.geturl(); parsed=urlparse(final_url)
                if parsed.scheme!='https': raise RuntimeError(f'non-HTTPS final URL {final_url}')
                if parsed.hostname not in spec['hosts']: raise RuntimeError(f'unapproved final host {parsed.hostname}')
                status=getattr(response,'status',200)
                if status!=200: raise RuntimeError(f'HTTP {status}')
                content_type=(response.headers.get_content_type() or '').lower()
                if content_type not in spec['types']: raise RuntimeError(f'unexpected content type {content_type}')
                body=response.read(spec['max_bytes']+1)
                if len(body)>spec['max_bytes']: raise RuntimeError('response exceeds byte limit')
                ok,error=signature_ok(spec['signature'],body)
                if not ok: raise RuntimeError(error)
                out=RESP/spec['output']; out.write_bytes(body)
                record={'request_id':spec['request_id'],'provider':spec['provider'],'request_url':spec['url'],'final_url':final_url,
                        'request_headers':{k:v for k,v in headers.items() if k.lower()!='authorization'},
                        'status':status,'content_type':content_type,'size_bytes':len(body),'sha256':hashlib.sha256(body).hexdigest(),
                        'output_path':f"responses/{spec['output']}",'redirects':rr.redirects,
                        'safe_response_headers':{k.lower():v for k,v in response.headers.items() if k.lower() in SAFE_RESPONSE_HEADERS}}
                manifest['artifacts'].append(record); print('OK',spec['request_id'],len(body),record['sha256'],flush=True)
            except Exception as exc:
              manifest['rejections'].append({'request_id':spec['request_id'],'provider':spec['provider'],'error_type':type(exc).__name__,'error':str(exc),'redirects':rr.redirects})
              print('REJECT',spec['request_id'],type(exc).__name__,str(exc),flush=True)

          def validate(name, fn):
            try: detail=fn(); manifest['validations'].append({'name':name,'status':'passed','detail':detail}); print('VALID',name,detail,flush=True)
            except Exception as exc: manifest['validations'].append({'name':name,'status':'failed','error_type':type(exc).__name__,'error':str(exc)}); print('INVALID',name,str(exc),flush=True)

          def iwb_check():
            p=json.loads((RESP/'iwb_holdings_2025-12-31.json').read_text(encoding='utf-8-sig'))
            rows=p.get('aaData');
            if not isinstance(rows,list) or len(rows)<500: raise RuntimeError('aaData missing or implausibly small')
            if not any(str(cell).strip().upper()=='AAPL' for cell in rows[0]): raise RuntimeError('first row does not contain AAPL')
            return {'rows':len(rows),'top_ticker':'AAPL'}
          def yahoo_check():
            p=json.loads((RESP/'aapl_yahoo_prices_2026-02-10.json').read_text())['chart']['result'][0]
            if p['meta'].get('symbol')!='AAPL': raise RuntimeError('symbol mismatch')
            if max(p['timestamp'])>1770733800: raise RuntimeError('post-cutoff timestamp returned')
            return {'rows':len(p['timestamp']),'last_timestamp':max(p['timestamp'])}
          def nasdaq_check():
            p=json.loads((RESP/'aapl_nasdaq_prices_2026-02-10.json').read_text(encoding='utf-8-sig'))
            rows=((p.get('data') or {}).get('tradesTable') or {}).get('rows')
            if not rows: raise RuntimeError('tradesTable rows missing')
            dates=[r.get('date') for r in rows if r.get('date')]
            if not any('02/10/2026' in d for d in dates): raise RuntimeError('cutoff row missing')
            return {'rows':len(rows),'first_date':dates[0],'last_date':dates[-1]}
          def sec_header_check():
            t=(RESP/'aapl_2026-04-30_after_hours_headers.html').read_text(errors='replace')
            if '20260430163041' not in t.replace('-','').replace(':','').replace(' ',''): raise RuntimeError('acceptance timestamp 20260430163041 missing')
            return {'acceptance_et':'2026-04-30T16:30:41-04:00','classification':'after_cutoff'}
          def sec_tickers_check():
            p=json.loads((RESP/'sec_company_tickers.json').read_text(encoding='utf-8-sig'))
            matches=[v for v in p.values() if v.get('ticker')=='AAPL' and int(v.get('cik_str',0))==320193]
            if len(matches)!=1: raise RuntimeError('AAPL CIK mapping missing or ambiguous')
            return matches[0]
          def alfred_check():
            lines=(RESP/'unrate_alfred_2026-02-10.csv').read_text(encoding='utf-8-sig').splitlines()
            if not lines or lines[0]!='DATE,UNRATE_20260210': raise RuntimeError(f'vintage header mismatch: {lines[0] if lines else None!r}')
            if any(line[:10]>'2026-02-10' for line in lines[1:] if len(line)>=10): raise RuntimeError('post-cutoff observation date')
            return {'header':lines[0],'observations':len(lines)-1}

          validate('iwb_json_structure',iwb_check); validate('yahoo_cutoff_bound',yahoo_check); validate('nasdaq_cutoff_row',nasdaq_check)
          validate('sec_after_hours_timestamp',sec_header_check); validate('sec_ticker_mapping',sec_tickers_check); validate('alfred_exact_vintage_column',alfred_check)
          manifest['completed_at_utc']=datetime.now(timezone.utc).isoformat()
          canonical=json.dumps(manifest,sort_keys=True,separators=(',',':')).encode(); manifest['manifest_sha256']=hashlib.sha256(canonical).hexdigest()
          (ROOT/'bundle_manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          failed=[v for v in manifest['validations'] if v['status']!='passed']
          status={'artifact_count':len(manifest['artifacts']),'rejection_count':len(manifest['rejections']),'failed_validation_count':len(failed),
                  'success':not manifest['rejections'] and not failed,'manifest_sha256':manifest['manifest_sha256']}
          (ROOT/'status.json').write_text(json.dumps(status,indent=2)+'\n'); print(json.dumps(status,indent=2),flush=True)
          PY
      - name: Upload raw acquisition bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-forecast-raw-bundle
          path: stock_forecast_raw_bundle
          if-no-files-found: error
          retention-days: 7
      - name: Enforce fail-closed status
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          status=json.loads(Path('stock_forecast_raw_bundle/status.json').read_text())
          if not status['success']: raise SystemExit(f'acquisition failed closed: {status}')
          PY
