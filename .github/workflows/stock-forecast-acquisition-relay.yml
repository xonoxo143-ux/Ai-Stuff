name: Stock Forecast Acquisition Relay

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Acquire and validate raw sources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import csv
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import ssl
          from urllib.parse import urlparse
          from urllib.request import Request, build_opener, HTTPRedirectHandler, HTTPSHandler
          from datetime import datetime, timezone

          ROOT = Path('stock_forecast_raw_bundle')
          RESP = ROOT / 'responses'
          RESP.mkdir(parents=True, exist_ok=True)
          USER_AGENT = 'blind-historical-stock-forecast/0.1 research-relay https://github.com/xonoxo143-ux/Ai-Stuff'
          SAFE_HEADERS = {'content-type', 'content-length', 'last-modified', 'etag', 'date', 'cache-control'}

          requests = [
              {
                  'request_id': 'iwb_holdings_2025-12-31',
                  'provider': 'ishares_iwb_holdings',
                  'url': 'https://www.ishares.com/us/products/239707/ishares-russell-1000-etf/1467271812596.ajax?fileType=csv&fileName=IWB_holdings&dataType=fund&asOfDate=20251231',
                  'output': 'iwb_holdings_2025-12-31.csv',
                  'types': {'text/csv', 'text/plain', 'application/octet-stream'},
                  'hosts': {'www.ishares.com'},
                  'max_bytes': 20_000_000,
              },
              {
                  'request_id': 'aapl_yahoo_prices_2026-02-10',
                  'provider': 'yahoo_chart',
                  'url': 'https://query1.finance.yahoo.com/v8/finance/chart/AAPL?period1=1739250000&period2=1770786000&interval=1d&events=div%2Csplits&includeAdjustedClose=true',
                  'output': 'aapl_yahoo_prices_2026-02-10.json',
                  'types': {'application/json', 'text/plain'},
                  'hosts': {'query1.finance.yahoo.com'},
                  'max_bytes': 10_000_000,
              },
              {
                  'request_id': 'aapl_stooq_prices_2026-02-10',
                  'provider': 'stooq',
                  'url': 'https://stooq.com/q/d/l/?s=aapl.us&d1=20250211&d2=20260210&i=d',
                  'output': 'aapl_stooq_prices_2026-02-10.csv',
                  'types': {'text/csv', 'text/plain', 'application/octet-stream'},
                  'hosts': {'stooq.com', 'stooq.pl'},
                  'max_bytes': 10_000_000,
              },
              {
                  'request_id': 'aapl_sec_submissions',
                  'provider': 'sec',
                  'url': 'https://data.sec.gov/submissions/CIK0000320193.json',
                  'output': 'aapl_sec_submissions.json',
                  'types': {'application/json', 'text/plain'},
                  'hosts': {'data.sec.gov'},
                  'max_bytes': 20_000_000,
              },
              {
                  'request_id': 'unrate_alfred_graph_vintage_2026-02-10',
                  'provider': 'alfred_graph_csv',
                  'url': 'https://alfred.stlouisfed.org/graph/alfredgraph.csv?id=UNRATE&vintage_date=2026-02-10&cosd=1900-01-01&coed=2026-02-10',
                  'output': 'unrate_alfred_2026-02-10.csv',
                  'types': {'text/csv', 'text/plain', 'application/octet-stream'},
                  'hosts': {'alfred.stlouisfed.org'},
                  'max_bytes': 20_000_000,
              },
          ]

          class RedirectRecorder(HTTPRedirectHandler):
              def __init__(self):
                  super().__init__()
                  self.redirects = []
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  self.redirects.append({'status': code, 'from': req.full_url, 'to': newurl})
                  return super().redirect_request(req, fp, code, msg, headers, newurl)

          manifest = {
              'bundle_version': 1,
              'purpose': 'Disposable pre-cutoff acquisition rehearsal and historical-universe probe; not a final exam packet.',
              'started_at_utc': datetime.now(timezone.utc).isoformat(),
              'git_sha': os.environ.get('GITHUB_SHA'),
              'git_ref': os.environ.get('GITHUB_REF'),
              'artifacts': [],
          }

          context = ssl.create_default_context()
          for spec in requests:
              redirector = RedirectRecorder()
              opener = build_opener(redirector, HTTPSHandler(context=context))
              headers = {'User-Agent': USER_AGENT, 'Accept-Encoding': 'identity'}
              if spec['provider'] == 'sec':
                  headers['Accept'] = 'application/json'
              req = Request(spec['url'], headers=headers, method='GET')
              with opener.open(req, timeout=60) as response:
                  final_url = response.geturl()
                  parsed = urlparse(final_url)
                  if parsed.scheme != 'https':
                      raise RuntimeError(f"{spec['request_id']}: non-HTTPS final URL {final_url}")
                  if parsed.hostname not in spec['hosts']:
                      raise RuntimeError(f"{spec['request_id']}: unapproved final host {parsed.hostname}")
                  content_type = (response.headers.get_content_type() or '').lower()
                  if content_type not in spec['types']:
                      raise RuntimeError(f"{spec['request_id']}: unexpected content type {content_type}")
                  body = response.read(spec['max_bytes'] + 1)
                  if len(body) > spec['max_bytes']:
                      raise RuntimeError(f"{spec['request_id']}: response exceeds byte limit")
                  status = getattr(response, 'status', 200)
                  if status != 200:
                      raise RuntimeError(f"{spec['request_id']}: HTTP {status}")
                  out = RESP / spec['output']
                  out.write_bytes(body)
                  manifest['artifacts'].append({
                      'request_id': spec['request_id'],
                      'provider': spec['provider'],
                      'request_url': spec['url'],
                      'final_url': final_url,
                      'status': status,
                      'content_type': content_type,
                      'size_bytes': len(body),
                      'sha256': hashlib.sha256(body).hexdigest(),
                      'output_path': f"responses/{spec['output']}",
                      'redirects': redirector.redirects,
                      'safe_response_headers': {
                          k.lower(): v for k, v in response.headers.items()
                          if k.lower() in SAFE_HEADERS
                      },
                  })

          iwb = (RESP / 'iwb_holdings_2025-12-31.csv').read_text(encoding='utf-8-sig')
          if 'Fund Holdings as of,"Dec 31, 2025"' not in iwb.splitlines()[:15]:
              raise RuntimeError('IWB embedded as-of date is not Dec 31, 2025')
          if 'Ticker,Name,Sector,Asset Class,Market Value,Weight (%)' not in iwb:
              raise RuntimeError('IWB holdings header missing')

          yahoo = json.loads((RESP / 'aapl_yahoo_prices_2026-02-10.json').read_text(encoding='utf-8'))
          chart = yahoo.get('chart', {})
          if chart.get('error') is not None or not chart.get('result'):
              raise RuntimeError(f"Yahoo chart error: {chart.get('error')}")
          if chart['result'][0].get('meta', {}).get('symbol') != 'AAPL':
              raise RuntimeError('Yahoo symbol mismatch')

          stooq_text = (RESP / 'aapl_stooq_prices_2026-02-10.csv').read_text(encoding='utf-8-sig')
          if not stooq_text.startswith('Date,Open,High,Low,Close,Volume'):
              raise RuntimeError('Stooq CSV header mismatch')
          stooq_rows = list(csv.DictReader(io.StringIO(stooq_text)))
          if not stooq_rows or max(row['Date'] for row in stooq_rows) > '2026-02-10':
              raise RuntimeError('Stooq missing rows or returned post-cutoff date')

          sec = json.loads((RESP / 'aapl_sec_submissions.json').read_text(encoding='utf-8'))
          if str(sec.get('cik')) != '320193':
              raise RuntimeError('SEC CIK mismatch')
          recent = sec.get('filings', {}).get('recent', {})
          if not recent.get('accessionNumber') or not recent.get('acceptanceDateTime'):
              raise RuntimeError('SEC submissions missing acceptance timestamps')

          alfred_text = (RESP / 'unrate_alfred_2026-02-10.csv').read_text(encoding='utf-8-sig')
          first_line = alfred_text.splitlines()[0] if alfred_text.splitlines() else ''
          if first_line != 'DATE,UNRATE_20260210':
              raise RuntimeError(f'ALFRED vintage header mismatch: {first_line!r}')

          manifest['completed_at_utc'] = datetime.now(timezone.utc).isoformat()
          canonical = json.dumps(manifest, sort_keys=True, separators=(',', ':')).encode('utf-8')
          manifest['manifest_sha256'] = hashlib.sha256(canonical).hexdigest()
          (ROOT / 'bundle_manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({
              'artifact_count': len(manifest['artifacts']),
              'manifest_sha256': manifest['manifest_sha256'],
              'artifact_sha256': {a['request_id']: a['sha256'] for a in manifest['artifacts']},
          }, indent=2))
          PY
      - name: Upload raw acquisition bundle
        uses: actions/upload-artifact@v4
        with:
          name: stock-forecast-raw-bundle
          path: stock_forecast_raw_bundle
          if-no-files-found: error
          retention-days: 7
