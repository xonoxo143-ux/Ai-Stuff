name: SemVM Adversarial Semantic Probe

on:
  workflow_dispatch:
  push:
    branches: [semzip-vm]
    paths:
      - ".github/workflows/semzip-vm-adversarial-semantic-probe.yml"
      - "semzip/benchmarks/compiler_delta_adversarial_corpus.py"
      - "semzip/benchmarks/train_adversarial_semantic_probe.py"
      - "semzip/benchmarks/train_semantic_probe_compiler.py"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: semvm-google-bert-l2-h128-v1
      - run: python -m pip install -e ./semzip
      - run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "transformers>=4.45,<5" safetensors
      - name: Train on contrastive curriculum and test unseen paraphrase dialect
        run: |
          cd semzip
          python benchmarks/train_adversarial_semantic_probe.py \
            --train-samples 4096 --eval-samples 256 --epochs 10 --batch-size 64 --semantic-dim 32
      - name: Show adversarial result
        if: always()
        run: |
          if [ -f semzip/compiler-semantic-probe-results.json ]; then
            python -c "import json; p=json.load(open('semzip/compiler-semantic-probe-results.json')); print(json.dumps({k:p[k] for k in ('model','mode','total_parameters','head_parameters','train_examples','train_probes','eval_examples','epochs','probe_active_accuracy','positive_pointer_accuracy','exact_patch','exact_patch_accuracy','family_exact','loss_history')}, indent=2))"
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semvm-adversarial-semantic-probe
          path: semzip/compiler-semantic-probe-results.json
          if-no-files-found: warn
          retention-days: 14
