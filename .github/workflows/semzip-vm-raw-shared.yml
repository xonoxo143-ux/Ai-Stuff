name: SemVM Raw Shared Encoder

on:
  workflow_dispatch:
  push:
    branches: [semzip-vm]
    paths:
      - ".github/workflows/semzip-vm-raw-shared.yml"
      - "semzip/benchmarks/compiler_raw_semantic_corpus.py"
      - "semzip/benchmarks/train_raw_shared_backbone.py"
      - "semzip/src/semzip/vm_mentions.py"
      - "semzip/src/semzip/vm_patch.py"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: semvm-google-bert-l2-h128-v1
      - run: python -m pip install -e ./semzip
      - run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "transformers>=4.45,<5" safetensors
      - name: Train shared tiny frontend
        run: |
          cd semzip
          python benchmarks/train_raw_shared_backbone.py \
            --train-samples 2048 --eval-samples 256 --epochs 8 \
            --mention-batch-size 32 --semantic-batch-size 64 \
            --semantic-rows-per-example 4 --semantic-dim 32
      - name: Show shared result
        if: always()
        run: |
          if [ -f semzip/compiler-raw-shared-results.json ]; then
            python -c "import json; p=json.load(open('semzip/compiler-raw-shared-results.json')); print(json.dumps({k:p[k] for k in ('model','mode','total_parameters','backbone_parameters','head_parameters','train_samples','eval_samples','epochs','semantic_rows_per_epoch','mention_exact_sentence_accuracy','semantic_exact_with_gold_mentions_accuracy','end_to_end_exact_patch_accuracy','pipeline_rejections','family_final_exact','caveat')}, indent=2))"
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semvm-raw-shared
          path: semzip/compiler-raw-shared-results.json
          if-no-files-found: warn
          retention-days: 14
