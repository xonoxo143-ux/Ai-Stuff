name: SemVM Raw End-to-End Compiler

on:
  workflow_dispatch:
  push:
    branches: [semzip-vm]
    paths:
      - ".github/workflows/semzip-vm-raw-end-to-end.yml"
      - "semzip/benchmarks/compiler_raw_semantic_corpus.py"
      - "semzip/benchmarks/train_raw_end_to_end.py"
      - "semzip/src/semzip/vm_mentions.py"
      - "semzip/src/semzip/vm_patch.py"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: semvm-google-bert-l2-h128-v1
      - run: python -m pip install -e ./semzip
      - run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "transformers>=4.45,<5" safetensors
      - name: Smoke joint raw semantic corpus
        run: |
          cd semzip
          python benchmarks/compiler_raw_semantic_corpus.py
      - name: Train two-stage raw semantic pipeline
        run: |
          cd semzip
          python benchmarks/train_raw_end_to_end.py \
            --train-samples 2048 --eval-samples 256 \
            --mention-epochs 8 --semantic-epochs 8 \
            --batch-size 32 --semantic-batch-size 64 --semantic-dim 32
      - name: Show integration result
        if: always()
        run: |
          if [ -f semzip/compiler-raw-end-to-end-results.json ]; then
            python -c "import json; p=json.load(open('semzip/compiler-raw-end-to-end-results.json')); print(json.dumps({k:p[k] for k in ('model','mode','mention_parameters','semantic_parameters','combined_parameters','train_samples','eval_samples','mention_exact_sentence_accuracy','semantic_exact_with_gold_mentions_accuracy','end_to_end_exact_patch_accuracy','pipeline_rejections','family_final_exact','caveat')}, indent=2))"
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semvm-raw-end-to-end
          path: semzip/compiler-raw-end-to-end-results.json
          if-no-files-found: warn
          retention-days: 14
