name: VSCO Pass 05 Render

on:
  push:
    branches:
      - orchestral-vsco-render
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out experiment
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy scipy pretty_midi soundfile

      - name: Fetch only the VSCO instruments used by Pass 05
        run: |
          mkdir -p vsco
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import urlopen
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import re, time

          ROOT = Path("vsco")
          BASE = "https://raw.githubusercontent.com/sgossner/VSCO-2-CE/SFZ/"
          SFZS = [
              "UprightPiano.sfz",
              "ViolinEnsSusVib.sfz",
              "ViolinEnsTrem.sfz",
              "SViolinVib.sfz",
              "ViolaEnsSusVib.sfz",
              "CelloEnsSusVib.sfz",
              "CelloEnsTrem.sfz",
              "ContrabassSusVB.sfz",
              "FHornSus.sfz",
              "TrumpetSus.sfz",
              "TrumpetSusVib.sfz",
              "Timpani.sfz",
          ]

          def download(rel):
              rel = rel.replace("\\", "/").strip("/")
              dest = ROOT / rel
              if dest.exists() and dest.stat().st_size:
                  return rel
              dest.parent.mkdir(parents=True, exist_ok=True)
              url = BASE + quote(rel, safe="/")
              err = None
              for i in range(4):
                  try:
                      with urlopen(url, timeout=90) as r:
                          dest.write_bytes(r.read())
                      return rel
                  except Exception as e:
                      err = e
                      time.sleep(1 + i * 2)
              raise RuntimeError(f"{rel}: {err}")

          for name in SFZS:
              download(name)

          sample_paths = set()
          for name in SFZS:
              txt = (ROOT / name).read_text(errors="ignore").replace("\r", "\n")
              m = re.search(r"default_path\s*=\s*([^\r\n]+)", txt, re.I)
              default = m.group(1).strip().replace("\\", "/") if m else ""
              for sm in re.findall(r"sample\s*=\s*([^\r\n]+)", txt, re.I):
                  sample_paths.add((default.rstrip("/") + "/" + sm.strip()).strip("/"))

          print(f"Downloading {len(sample_paths)} referenced sample files...")
          with ThreadPoolExecutor(max_workers=16) as ex:
              futures = [ex.submit(download, p) for p in sorted(sample_paths)]
              done = 0
              for f in as_completed(futures):
                  f.result()
                  done += 1
                  if done % 25 == 0 or done == len(futures):
                      print(f"{done}/{len(futures)} samples")
          PY

      - name: Reconstruct and verify Pass 05 MIDI
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, zlib, hashlib, pretty_midi
          src = Path("music/vsco_pass05/pass05.mid.zlib.b64").read_text().strip()
          data = zlib.decompress(base64.b64decode(src))
          digest = hashlib.sha256(data).hexdigest()
          expected = "ccbf27d89730caa5f90d4bd7809fe047b5aa29b268974c22df718ae4f110f180"
          if digest != expected:
              raise SystemExit(f"MIDI SHA mismatch: {digest}")
          out = Path("music/vsco_pass05/pass05.mid")
          out.write_bytes(data)
          p = pretty_midi.PrettyMIDI(str(out))
          print("MIDI OK", len(p.instruments), "tracks", round(p.get_end_time(), 2), "sec", digest)
          PY

      - name: Render with VSCO multisamples
        env:
          MIDI_PATH: music/vsco_pass05/pass05.mid
          VSCO_ROOT: vsco
          OUT_DIR: rendered
        run: |
          python music/vsco_pass05/render_vsco.py


      - name: Upload rendered audio
        uses: actions/upload-artifact@v4
        with:
          name: vsco-pass05
          path: |
            rendered/pass05_vsco.wav

            rendered/render_report.txt
          retention-days: 7
