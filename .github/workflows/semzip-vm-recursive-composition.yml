name: SemVM Recursive Semantic Composition

on:
  workflow_dispatch:
  push:
    branches: [semzip-vm]
    paths:
      - ".github/workflows/semzip-vm-recursive-composition.yml"
      - "semzip/benchmarks/train_recursive_clause_composer.py"
      - "semzip/benchmarks/compiler_composition_clean_corpus.py"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: semvm-google-bert-l2-h128-v1
      - run: python -m pip install -e ./semzip
      - run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "transformers>=4.45,<5" safetensors
      - name: Train atomic compiler and compose patches recursively
        run: |
          cd semzip
          python benchmarks/train_recursive_clause_composer.py \
            --train-samples 512 --eval-samples 96 --epochs 14 --batch-size 16 --semantic-dim 32
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semvm-recursive-composition
          path: semzip/compiler-recursive-clause-results.json
          if-no-files-found: warn
          retention-days: 14
