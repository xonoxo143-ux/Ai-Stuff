name: Agent Dialogue State Gate v2
on:
  push:
    branches:
      - experiment/agent-v1-developmental-ecology
    paths:
      - 'agent-model/agent_runtime/dialogue_state_gate_v2.py'
      - '.github/workflows/agent-dialogue-state-v2.yml'
  workflow_dispatch:
jobs:
  dialogue-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/agent-v1-developmental-ecology
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run robust construction dialogue-state gate
        run: |
          python agent-model/agent_runtime/dialogue_state_gate_v2.py \
            --seeds 0,1,2 \
            --out dialogue_state_v2.json
      - uses: actions/upload-artifact@v4
        with:
          name: Agent-Dialogue-State-V2
          path: dialogue_state_v2.json
