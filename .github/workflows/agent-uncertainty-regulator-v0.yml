name: Agent Uncertainty Regulator Gate v0
on:
  push:
    branches:
      - experiment/agent-v1-developmental-ecology
    paths:
      - 'agent-model/agent_runtime/uncertainty_regulator_gate_v0.py'
      - '.github/workflows/agent-uncertainty-regulator-v0.yml'
  workflow_dispatch:
jobs:
  uncertainty:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/agent-v1-developmental-ecology
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run uncertainty regulator gate
        run: |
          python agent-model/agent_runtime/uncertainty_regulator_gate_v0.py \
            --seeds 0,1,2 \
            --out uncertainty_regulator_v0.json
      - uses: actions/upload-artifact@v4
        with:
          name: Agent-Uncertainty-Regulator-V0
          path: uncertainty_regulator_v0.json
