name: Agent V1 Interference Localization

on:
  workflow_dispatch:
  push:
    branches:
      - "experiment/agent-v1-developmental-ecology"
    paths:
      - "agent-model/agent_ecology/v1_interference_localize.py"
      - "agent-model/tests/test_v1_interference_localize.py"
      - "docs/AGENT_V1_A1_INTERFERENCE_RESULT.md"
      - "docs/AGENT_V1_A1_INTERFERENCE_LOCALIZE.md"
      - ".github/workflows/agent-v1-interference-localize.yml"

permissions:
  contents: read

concurrency:
  group: agent-v1-interference-localization
  cancel-in-progress: true

jobs:
  localize:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU stack
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4,<3"
          python -m pip install "numpy>=1.26,<3" "pytest>=8"
          python -m pip install -e agent-model --no-deps

      - name: Run focused tests
        run: |
          set -euo pipefail
          pytest agent-model/tests/test_v1_interference_localize.py

      - name: Run causal one-step localization
        working-directory: agent-model
        run: |
          set -euo pipefail
          python -m agent_ecology.v1_interference_localize             --family-count 64             --seeds 1101,1102,1103             --model-seed-base 12000             --checkpoints-after 7,15,31,47             --train-examples 20             --eval-examples 16             --sequence-length 4             --state-dim 24             --workspace-slots 3             --signature-dim 12             --message-dim 12             --thought-steps 2             --output /tmp/v1-interference-localize.json

      - uses: actions/upload-artifact@v4
        with:
          name: Agent-V1-Interference-Localization
          path: /tmp/v1-interference-localize.json
          retention-days: 30
