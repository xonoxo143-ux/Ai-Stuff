name: Alien Math Music Experiment

on:
  push:
    branches: [music-math-experiment]
    paths:
      - "music_math/manifest.json"
      - "music_math/run_analysis.py"
      - ".github/workflows/music-math.yml"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: music-math-experiment
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install analysis dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          pip install numpy scipy scikit-learn matplotlib
      - name: Run blind alien-math experiment
        run: python music_math/run_analysis.py
      - name: Upload complete result bundle
        uses: actions/upload-artifact@v4
        with:
          name: alien-math-music-results
          path: music_math/results/
      - name: Save result tables and report to experiment branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music_math/results/
          git diff --cached --quiet || git commit -m "Record alien-math experiment results [skip ci]"
          git push
