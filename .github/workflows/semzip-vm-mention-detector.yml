name: SemVM Mention Detector

on:
  workflow_dispatch:
  push:
    branches: [semzip-vm]
    paths:
      - ".github/workflows/semzip-vm-mention-detector.yml"
      - "semzip/benchmarks/compiler_mention_corpus.py"
      - "semzip/benchmarks/train_mention_detector.py"
      - "semzip/src/semzip/vm_mentions.py"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: semvm-google-bert-l2-h128-v1
      - run: python -m pip install -e ./semzip
      - run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "transformers>=4.45,<5" safetensors
      - name: Smoke raw mention corpus
        run: |
          cd semzip
          python benchmarks/compiler_mention_corpus.py
      - name: Train mention detector
        run: |
          cd semzip
          python benchmarks/train_mention_detector.py \
            --train-samples 2048 --eval-samples 256 --epochs 8 --batch-size 32
      - name: Show result
        if: always()
        run: |
          if [ -f semzip/compiler-mention-results.json ]; then
            python -c "import json; p=json.load(open('semzip/compiler-mention-results.json')); print(json.dumps({k:p[k] for k in ('model','mode','total_parameters','head_parameters','train_samples','eval_samples','epochs','mention_precision','mention_recall','mention_f1','exact_span_sentence_accuracy','exact_slotization_accuracy','family_exact','loss_history')}, indent=2))"
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semvm-mention-detector
          path: |
            semzip/compiler-mention-results.json
            semzip/semvm-mention-detector
          if-no-files-found: warn
          retention-days: 14
