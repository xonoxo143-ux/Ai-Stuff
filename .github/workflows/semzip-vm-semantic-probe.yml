name: SemVM Semantic Probe Compiler

on:
  workflow_dispatch:
  push:
    branches: [semzip-vm]
    paths:
      - ".github/workflows/semzip-vm-semantic-probe.yml"
      - "semzip/benchmarks/train_semantic_probe_compiler.py"
      - "semzip/benchmarks/train_composition_semantic_probe.py"
      - "semzip/benchmarks/compiler_composition_corpus.py"

jobs:
  standard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: semvm-google-bert-l2-h128-v1
      - run: python -m pip install -e ./semzip
      - run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "transformers>=4.45,<5" safetensors
      - name: Train semantic probes on standard benchmark
        run: |
          cd semzip
          python benchmarks/train_semantic_probe_compiler.py \
            --train-samples 512 --eval-samples 96 --epochs 8 --batch-size 64 --semantic-dim 32
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semvm-semantic-probe-standard
          path: semzip/compiler-semantic-probe-results.json
          if-no-files-found: warn
          retention-days: 14

  composition:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: semvm-google-bert-l2-h128-v1
      - run: python -m pip install -e ./semzip
      - run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "transformers>=4.45,<5" safetensors
      - name: Train semantic probes on composition holdout
        run: |
          cd semzip
          python benchmarks/train_composition_semantic_probe.py \
            --train-samples 512 --eval-samples 96 --epochs 8 --batch-size 64 --semantic-dim 32
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semvm-semantic-probe-composition
          path: semzip/compiler-semantic-probe-results.json
          if-no-files-found: warn
          retention-days: 14
