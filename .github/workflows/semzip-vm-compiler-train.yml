name: SemVM Compiler Fine-tune

on:
  workflow_dispatch:
  push:
    branches: [semzip-vm]
    paths:
      - ".github/workflows/semzip-vm-compiler-train.yml"
      - "semzip/benchmarks/compiler_corpus.py"
      - "semzip/benchmarks/train_smollm_compiler.py"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: semvm-smollm2-135m-v1

      - name: Install SemVM
        run: python -m pip install -e ./semzip

      - name: Install CPU training runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "transformers>=4.45,<5" safetensors "peft>=0.13,<1"

      - name: Run compiler fine-tune
        run: |
          cd semzip
          python benchmarks/train_smollm_compiler.py --train-samples 96 --eval-samples 16 --epochs 2 --batch-size 2

      - name: Show result
        if: always()
        run: |
          if [ -f semzip/compiler-finetune-results.json ]; then
            python -c "import json; p=json.load(open('semzip/compiler-finetune-results.json')); print(json.dumps({k:p[k] for k in ('model','train_samples','eval_samples','epochs','trainable_parameters','loss_history','valid_json','valid_program','exact_program','family_exact')}, indent=2))"
          fi

      - name: Upload adapter and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semvm-smollm2-135m-compiler
          path: |
            semzip/compiler-finetune-results.json
            semzip/semvm-compiler-adapter
          if-no-files-found: warn
          retention-days: 14
