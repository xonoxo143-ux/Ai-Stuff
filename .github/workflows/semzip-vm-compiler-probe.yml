name: SemVM Compiler Probe

on:
  push:
    branches: [semzip-vm]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SemVM
        run: python -m pip install -e ./semzip

      - name: Run SemVM gate
        run: |
          cd semzip
          python -m unittest tests.test_vm_v04 -v
          python benchmarks/vm_progress_gate.py
