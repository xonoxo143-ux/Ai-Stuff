name: SemVM Compiler Probe

on:
  push:
    branches: [semzip-vm]
    paths:
      - ".github/workflows/semzip-vm-compiler-probe.yml"
      - "semzip/benchmarks/compiler_probe_smollm.py"
      - "semzip/src/semzip/vm_bridge.py"
      - "semzip/src/semzip/vm_kernel.py"
      - "semzip/src/semzip/vm_compile.py"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SemVM
        run: python -m pip install -e ./semzip

      - name: Run SemVM gate
        run: |
          cd semzip
          python -m unittest tests.test_vm_v04 -v
          python benchmarks/vm_progress_gate.py

      - name: Install CPU model runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "transformers>=4.45,<5" safetensors

      - name: Run SmolLM compiler baseline
        run: |
          cd semzip
          python benchmarks/compiler_probe_smollm.py

      - name: Show compiler result
        if: always()
        run: |
          if [ -f semzip/compiler-probe-results.json ]; then
            cat semzip/compiler-probe-results.json
          fi
