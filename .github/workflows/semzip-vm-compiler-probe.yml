name: SemVM Compiler Probe

on:
  push:
    branches: [semzip-vm]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SemVM
        run: python -m pip install -e ./semzip

      - name: Run SemVM gate
        run: |
          cd semzip
          python -m unittest tests.test_vm_v04 -v
          python benchmarks/vm_progress_gate.py

      - name: Install CPU model runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "transformers>=4.45,<5" safetensors

      - name: Smoke-test SmolLM download
        run: |
          python - <<'PY'
          from transformers import AutoTokenizer, AutoModelForCausalLM
          model_id = "HuggingFaceTB/SmolLM2-135M-Instruct"
          tok = AutoTokenizer.from_pretrained(model_id)
          model = AutoModelForCausalLM.from_pretrained(model_id)
          print("tokenizer_vocab", len(tok))
          print("parameters", sum(p.numel() for p in model.parameters()))
          PY
