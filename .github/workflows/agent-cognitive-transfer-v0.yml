name: Agent Cognitive Transfer V0

on:
  workflow_dispatch:
  push:
    branches:
      - "experiment/agent-v1-developmental-ecology"
    paths:
      - "agent-model/agent_cognition/transfer.py"
      - "agent-model/tests/test_agent_cognitive_transfer_v0.py"
      - "docs/AGENT_COGNITIVE_TRANSFER_V0.md"
      - ".github/workflows/agent-cognitive-transfer-v0.yml"

permissions:
  contents: read

concurrency:
  group: agent-cognitive-transfer-v0
  cancel-in-progress: true

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU training stack
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch>=2.4,<3"
          python -m pip install "numpy>=1.26,<3" "pytest>=8"
          python -m pip install -e agent-model --no-deps

      - name: Validate cognition package syntax
        run: |
          set -euo pipefail
          python -m compileall -q agent-model/agent_cognition

      - name: Validate transfer benchmark
        run: |
          set -euo pipefail
          pytest agent-model/tests/test_agent_cognitive_transfer_v0.py

      - name: Measure transfer learning curves
        working-directory: agent-model
        run: |
          set -euo pipefail
          mkdir -p /tmp/cognitive-transfer-v0
          python -m agent_cognition.transfer \
            --seeds 11,22,33 \
            --pretrain-steps 400 \
            --checkpoints 0,8,16,32,64,128,256,512,1024 \
            --batch-size 32 \
            --eval-count 200 \
            --threads 4 \
            --output /tmp/cognitive-transfer-v0/result.json

      - uses: actions/upload-artifact@v4
        with:
          name: Agent-Cognitive-Transfer-V0
          path: /tmp/cognitive-transfer-v0/
          retention-days: 30
